version: '3.8'

# Определите сети в начале файла
networks:
  app-network:
    driver: bridge

services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: node-backend
    restart: unless-stopped
    ports:
      - "6969:6969"
    environment:
      - NODE_ENV=development_docker
      - MODE=development_docker
      - ME_URL=http://localhost:6969
      - FRONT_SECRET=FRONT_SECRET
      - PORT=6969
      - MONGODB_URI=mongodb://admin:password123@mongodb:27017/business_russia?authSource=admin
      - MONGO_DB_NAME=business_russia
      - JWT_SECRET=JWT_SECRET
      - ADMIN_LOGIN=login
      - ADMIN_PASSWORD=password
    volumes:
      - ./server:/app
      - /app/node_modules
      - ./server/.env:/app/.env:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - app-network

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: next-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
    volumes:
      - ./client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - server
    networks:
      - app-network

volumes:
  mongodb_data: